<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Telegram Mini App</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #070b14;
      --card: rgba(23, 29, 46, 0.92);
      --card-2: rgba(27, 34, 54, 0.96);
      --line: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --muted: #c2cade;
      --btn: rgba(20, 26, 41, 0.90);
      --btn-border: rgba(255, 255, 255, 0.06);
      --accent: #2d8cff;
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(48, 84, 180, 0.16), transparent 26%),
        radial-gradient(circle at top right, rgba(66, 30, 110, 0.18), transparent 28%),
        linear-gradient(180deg, #090d17 0%, #070b14 100%);
      color: var(--text);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.08;
      background-image:
        radial-gradient(circle at 10% 15%, #6b7aa5 0 1px, transparent 1px),
        radial-gradient(circle at 80% 12%, #6b7aa5 0 1px, transparent 1px),
        radial-gradient(circle at 20% 70%, #6b7aa5 0 1px, transparent 1px),
        radial-gradient(circle at 75% 80%, #6b7aa5 0 1px, transparent 1px);
      background-size: 180px 180px;
    }

    .app {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 18px 14px 24px;
    }

    .hero {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 26px;
      padding: 22px 18px 18px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
      backdrop-filter: blur(8px);
    }

    .hero-title {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 14px;
    }

    .hero-text {
      font-size: 18px;
      line-height: 1.5;
      color: #f1f4fb;
      white-space: pre-line;
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .menu-btn {
      width: 100%;
      border: 1px solid var(--btn-border);
      border-radius: 22px;
      background: var(--btn);
      color: var(--text);
      box-shadow: var(--shadow);
      padding: 20px 18px;
      font-size: 18px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease, background 0.15s ease;
      backdrop-filter: blur(10px);
    }

    .menu-btn:active {
      transform: scale(0.985);
      opacity: 0.92;
    }

    .menu-btn .icon {
      font-size: 23px;
      line-height: 1;
      flex-shrink: 0;
    }

    .menu-btn .label {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.2;
    }

    .bottom-box {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: var(--card-2);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    .user-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.06);
      font-size: 13px;
      color: #d8e0f0;
      flex-wrap: wrap;
      justify-content: center;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #38d66b;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .small-name {
      font-weight: 700;
      color: #ffffff;
    }

    @media (max-width: 430px) {
      .hero-title {
        font-size: 22px;
      }

      .hero-text {
        font-size: 16px;
      }

      .menu-btn {
        padding: 18px 14px;
      }

      .menu-btn .label {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="hero">
      <div class="hero-title" id="heroTitle">🎮 PUBG Mobile Ücretsiz Hile / Config / VPN Dosyaları!</div>
      <div class="hero-text" id="heroText">Yükleniyor...</div>

      <div class="user-chip">
        <span class="dot"></span>
        <span id="userChipText">Bağlanıyor...</span>
      </div>
    </div>

    <div class="menu-list">
      <button class="menu-btn" onclick="openMenu('cheat_menu')">
        <span class="icon">🎮</span>
        <span class="label" id="btnCheat">Hile Menüsü</span>
      </button>

      <button class="menu-btn" onclick="openMenu('referral_center')">
        <span class="icon">👥</span>
        <span class="label" id="btnReferral">Referans Merkezi</span>
      </button>

      <button class="menu-btn" onclick="openMenu('apk_obb_menu')">
        <span class="icon">📦</span>
        <span class="label" id="btnApk">APK + OBB Menüsü</span>
      </button>

      <button class="menu-btn" onclick="openMenu('mini_games')">
        <span class="icon">🎯</span>
        <span class="label" id="btnGames">Mini Oyunlar</span>
      </button>

      <button class="menu-btn" onclick="openMenu('settings')">
        <span class="icon">⚙️</span>
        <span class="label" id="btnSettings">Ayarlar</span>
      </button>

      <button class="menu-btn" onclick="openMenu('admin_panel')">
        <span class="icon">🛠️</span>
        <span class="label" id="btnAdmin">Admin Paneli</span>
      </button>
    </div>

    <div class="bottom-box" id="footerText">
      Menü butonlarına bastığında seçim bot tarafına gönderilir.
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const params = new URLSearchParams(window.location.search);
    const lang = params.get("lang") || "tr";
    const tgUser = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
    const urlUserId = params.get("user_id") || "-";

    const TEXTS = {
      tr: {
        heroTitle: "🎮 PUBG Mobile Ücretsiz\nHile / Config / VPN Dosyaları!",
        heroText:
`🚀 Yalnızca bu botta, dünyada ilk kez!
💻 Hile, Config ve VPN dosyalarını kolayca indir ve hemen oyna!
👇 Aşağıdaki menüden devam et:`,

        cheat: "Hile Menüsü",
        referral: "Referans Merkezi",
        apk: "APK + OBB Menüsü",
        games: "Mini Oyunlar",
        settings: "Ayarlar",
        admin: "Admin Paneli",
        footer: "Menü butonlarına bastığında seçim bot tarafına gönderilir.",
        connectedAs: "Bağlı kullanıcı",
      },

      en: {
        heroTitle: "🎮 PUBG Mobile Free\nCheat / Config / VPN Files!",
        heroText:
`🚀 Only in this bot, for the first time in the world!
💻 Easily download Cheat, Config and VPN files and start playing instantly!
👇 Continue from the menu below:`,

        cheat: "Cheat Menu",
        referral: "Referral Center",
        apk: "APK + OBB Menu",
        games: "Mini Games",
        settings: "Settings",
        admin: "Admin Panel",
        footer: "When you tap a menu button, the selection is sent to the bot.",
        connectedAs: "Connected user",
      },

      ru: {
        heroTitle: "🎮 Бесплатные\nCheat / Config / VPN файлы для PUBG Mobile!",
        heroText:
`🚀 Только в этом боте, впервые в мире!
💻 Легко скачивайте Cheat, Config и VPN файлы и сразу начинайте играть!
👇 Продолжайте через меню ниже:`,

        cheat: "Меню читов",
        referral: "Реферальный центр",
        apk: "Меню APK + OBB",
        games: "Мини-игры",
        settings: "Настройки",
        admin: "Админ-панель",
        footer: "При нажатии на кнопку меню выбор отправляется боту.",
        connectedAs: "Подключённый пользователь",
      },

      uz: {
        heroTitle: "🎮 PUBG Mobile Bepul\nCheat / Config / VPN Fayllari!",
        heroText:
`🚀 Faqat shu botda, dunyoda ilk bor!
💻 Cheat, Config va VPN fayllarini oson yuklab olib, darhol o‘ynang!
👇 Quyidagi menyudan davom eting:`,

        cheat: "Cheat Menyusi",
        referral: "Referal Markazi",
        apk: "APK + OBB Menyusi",
        games: "Mini O‘yinlar",
        settings: "Sozlamalar",
        admin: "Admin Paneli",
        footer: "Menyu tugmasini bossangiz, tanlov botga yuboriladi.",
        connectedAs: "Ulangan foydalanuvchi",
      }
    };

    const t = TEXTS[lang] || TEXTS.tr;

    document.getElementById("heroTitle").innerText = t.heroTitle;
    document.getElementById("heroText").innerText = t.heroText;
    document.getElementById("btnCheat").innerText = t.cheat;
    document.getElementById("btnReferral").innerText = t.referral;
    document.getElementById("btnApk").innerText = t.apk;
    document.getElementById("btnGames").innerText = t.games;
    document.getElementById("btnSettings").innerText = t.settings;
    document.getElementById("btnAdmin").innerText = t.admin;
    document.getElementById("footerText").innerText = t.footer;

    const displayName = tgUser
      ? `${tgUser.first_name || ""} ${tgUser.last_name || ""}`.trim()
      : "User";

    const displayId = tgUser ? tgUser.id : urlUserId;

    document.getElementById("userChipText").innerHTML =
      `${t.connectedAs}: <span class="small-name">${displayName}</span> • ID: ${displayId}`;

    function openMenu(action) {
      try {
        if (tg.HapticFeedback) {
          tg.HapticFeedback.impactOccurred("light");
        }
      } catch (e) {}

      const data = {
        action: action,
        lang: lang,
        user_id: displayId,
        username: tgUser && tgUser.username ? tgUser.username : "",
        first_name: tgUser && tgUser.first_name ? tgUser.first_name : "",
        time: new Date().toISOString()
      };

      tg.sendData(JSON.stringify(data));
    }
  </script>
</body>
</html>
